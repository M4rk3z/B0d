# Foundation only. Free resources are for evaluation, not the final attendance deployment.
services:
  - type: web
    name: b0d-control-web
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile --prod
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: b0d-postgres
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: b0d-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: b0d
    ipAllowList: []
